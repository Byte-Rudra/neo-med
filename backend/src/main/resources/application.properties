# Supabase PostgreSQL connection
# Direct host (db.<project-ref>.supabase.co:5432) requires IPv6 support.
# If your host/network is IPv4-only, use the Supabase "Session pooler" values
# from the Connect panel and set SUPABASE_DB_URL / SUPABASE_DB_USERNAME.
spring.config.import=optional:file:.env.properties
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.jajnxodxhufmxzqtsrbp.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate Configuration
# 'update' automatically creates/updates database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set server port if needed (default is 8080)
server.port=${PORT:8080}
